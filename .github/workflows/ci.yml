name: Documentation validation

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/validate-docs.ps1

      - name: Validate performance evidence contract
        shell: pwsh
        run: ./scripts/performance/test-performance-evidence-validator.ps1

      - name: Smoke-test performance sampler
        shell: pwsh
        run: ./scripts/performance/test-process-sampler.ps1

      - name: Validate process sample summarizer
        shell: pwsh
        run: ./scripts/performance/test-process-sample-summarizer.ps1

      - name: Validate cross-run selection
        shell: pwsh
        run: ./scripts/performance/test-performance-run-selector.ps1

      - name: Validate performance evidence assembly
        shell: pwsh
        run: ./scripts/performance/test-performance-evidence-assembler.ps1

      - name: Detect solution
        id: solution
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -Path . -Filter *.sln -File -Recurse).Count -gt 0
          "found=$($found.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify .NET CI failure propagation
        shell: pwsh
        run: ./scripts/test-ci-dotnet-exit-codes.ps1

      - name: Restore and test .NET solution
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          $solutions = Get-ChildItem -Path . -Filter *.sln -File -Recurse
          foreach ($solution in $solutions) {
            dotnet restore $solution.FullName
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet build $solution.FullName --no-restore --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet format $solution.FullName --no-restore --verify-no-changes
            if ($LASTEXITCODE -ne 0) { throw "dotnet format failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet test $solution.FullName --no-build --configuration Release `
              --logger "trx;LogFilePrefix=test-results" `
              --results-directory "$env:RUNNER_TEMP\test-results"
            if ($LASTEXITCODE -ne 0) { throw "dotnet test failed for $($solution.FullName) (exit $LASTEXITCODE)." }
          }

      - name: Upload test results
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '${{ runner.temp }}/test-results/*.trx'
          if-no-files-found: error

      - name: Publish native engineering executable
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'e2-2-engineering'
          dotnet publish src/Zhuomian.App --configuration Release --runtime win-x64 --self-contained true --output $output
          if ($LASTEXITCODE -ne 0) { throw "Native engineering publish failed (exit $LASTEXITCODE)." }
          $exe = Join-Path $output 'Zhuomian.App.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Published EXE missing.' }
          Copy-Item src/Zhuomian.App/Start-Engineering.cmd, src/Zhuomian.App/README.md -Destination $output
          Copy-Item docs/ADR/0005-e2-native-engineering-host.md -Destination $output
          Copy-Item docs/ADR/0006-e2-native-motion.md -Destination $output
          $readme = Get-Content (Join-Path $output 'README.md') -Raw
          $readme = $readme.Replace('../../docs/ADR/0005-e2-native-engineering-host.md', '0005-e2-native-engineering-host.md')
          $readme = $readme.Replace('../../docs/ADR/0006-e2-native-motion.md', '0006-e2-native-motion.md')
          $readme = $readme.Replace('../../scripts/performance/README.md', 'https://github.com/Niceskys/zhuomian/blob/feature/e2-2-native-transitions/scripts/performance/README.md')
          Set-Content (Join-Path $output 'README.md') -Value $readme
          & $exe --native-smoke 2>&1 | Tee-Object -FilePath (Join-Path $output 'ci-native-smoke.log')
          if ($LASTEXITCODE -ne 0) { throw "Published EXE native smoke failed (exit $LASTEXITCODE)." }
          "commit=${{ github.event.pull_request.head.sha || github.sha }}" | Set-Content (Join-Path $output 'BUILD.txt')
          "CI hidden window only; attended desktop and product performance UNVERIFIED." | Add-Content (Join-Path $output 'BUILD.txt')
          Get-ChildItem -LiteralPath $output -File | Sort-Object Name | ForEach-Object {
            "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash )  $($_.Name)"
          } | Set-Content (Join-Path $output 'SHA256SUMS.txt')

      - name: Upload native engineering candidate
        uses: actions/upload-artifact@v7
        with:
          name: e2-2-windows-x64-engineering
          path: '${{ runner.temp }}/e2-2-engineering/'
          if-no-files-found: error
