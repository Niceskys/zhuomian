name: Documentation validation

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/validate-docs.ps1

      - name: Validate performance evidence contract
        shell: pwsh
        run: ./scripts/performance/test-performance-evidence-validator.ps1

      - name: Smoke-test performance sampler
        shell: pwsh
        run: ./scripts/performance/test-process-sampler.ps1

      - name: Validate process sample summarizer
        shell: pwsh
        run: ./scripts/performance/test-process-sample-summarizer.ps1

      - name: Validate cross-run selection
        shell: pwsh
        run: ./scripts/performance/test-performance-run-selector.ps1

      - name: Validate performance evidence assembly
        shell: pwsh
        run: ./scripts/performance/test-performance-evidence-assembler.ps1

      - name: Detect solution
        id: solution
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -Path . -Filter *.sln -File -Recurse).Count -gt 0
          "found=$($found.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify .NET CI failure propagation
        shell: pwsh
        run: ./scripts/test-ci-dotnet-exit-codes.ps1

      - name: Restore and test .NET solution
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          $solutions = Get-ChildItem -Path . -Filter *.sln -File -Recurse
          foreach ($solution in $solutions) {
            dotnet restore $solution.FullName
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet build $solution.FullName --no-restore --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet format $solution.FullName --no-restore --verify-no-changes
            if ($LASTEXITCODE -ne 0) { throw "dotnet format failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet test $solution.FullName --no-build --configuration Release `
              --logger "trx;LogFilePrefix=test-results" `
              --results-directory "$env:RUNNER_TEMP\test-results"
            if ($LASTEXITCODE -ne 0) { throw "dotnet test failed for $($solution.FullName) (exit $LASTEXITCODE)." }
          }

      - name: Upload test results
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '${{ runner.temp }}/test-results/*.trx'
          if-no-files-found: error
