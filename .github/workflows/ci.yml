name: Documentation validation

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/validate-docs.ps1

      - name: Validate performance evidence contract
        shell: pwsh
        run: ./scripts/performance/test-performance-evidence-validator.ps1

      - name: Smoke-test performance sampler
        shell: pwsh
        run: ./scripts/performance/test-process-sampler.ps1

      - name: Validate process sample summarizer
        shell: pwsh
        run: ./scripts/performance/test-process-sample-summarizer.ps1

      - name: Validate cross-run selection
        shell: pwsh
        run: ./scripts/performance/test-performance-run-selector.ps1

      - name: Validate performance evidence assembly
        shell: pwsh
        run: ./scripts/performance/test-performance-evidence-assembler.ps1

      - name: Detect solution
        id: solution
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -Path . -Filter *.sln -File -Recurse).Count -gt 0
          "found=$($found.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Record controlled launch test platform
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          if (-not $IsWindows) { throw 'Native launch evidence requires the Windows CI runner.' }
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed (exit $LASTEXITCODE)." }
          $metadata = [ordered]@{
            schemaVersion = 1
            commitSha = '${{ github.sha }}'
            windowsBuild = [Environment]::OSVersion.Version.ToString()
            sdk = $sdk.Trim()
            processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            launchProject = 'Zhuomian.Launching.Windows'
            launchTestProject = 'Zhuomian.Launching.Windows.Tests'
            deployment = 'framework-dependent test apphost'
            nativeBoundary = 'owned zero-argument CreateProcess fixture and private filesystem'
            userApplicationAcceptance = $false
            associationLaunchEnabled = $false
            desktopAcceptance = $false
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/launch-platform.json" -Encoding utf8
          $metadata | ConvertTo-Json

      - name: Verify .NET CI failure propagation
        shell: pwsh
        run: ./scripts/test-ci-dotnet-exit-codes.ps1

      - name: Configure generated v2 evidence
        shell: pwsh
        run: |
          "E3_V2_EVIDENCE_DIR=$env:RUNNER_TEMP/v2-evidence" >> $env:GITHUB_ENV

      - name: Build immutable reviewed v2 performance baseline
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: ./scripts/persistence/prepare-v2-round3-baseline.ps1 -OutputDirectory "$env:RUNNER_TEMP/v2-round3-baseline"

      - name: Restore and test .NET solution
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          $solutions = Get-ChildItem -Path . -Filter *.sln -File -Recurse
          foreach ($solution in $solutions) {
            dotnet restore $solution.FullName
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet build $solution.FullName --no-restore --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            dotnet format $solution.FullName --no-restore --verify-no-changes
            if ($LASTEXITCODE -ne 0) { throw "dotnet format failed for $($solution.FullName) (exit $LASTEXITCODE)." }
            # Serialize projects so the unchanged v1 killed-owner cleanup is not
            # competing with the larger v2 native file/process benchmark workload.
            dotnet test $solution.FullName --no-build --configuration Release -m:1 `
              --logger "trx;LogFilePrefix=test-results" `
              --results-directory "$env:RUNNER_TEMP\test-results"
            if ($LASTEXITCODE -ne 0) { throw "dotnet test failed for $($solution.FullName) (exit $LASTEXITCODE)." }
          }

      - name: Verify actual v2 native capacity and crash evidence
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          ./scripts/persistence/collect-v2-evidence.ps1 `
            -ResultsDirectory "$env:RUNNER_TEMP/test-results" `
            -EvidenceDirectory "$env:E3_V2_EVIDENCE_DIR" `
            -CommitSha '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Verify opt-in authority recovery and immutable performance comparison
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          ./scripts/persistence/collect-v3-evidence.ps1 `
            -EvidenceDirectory "$env:E3_V2_EVIDENCE_DIR" `
            -CommitSha '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Execute immutable legacy compatibility and same-protocol capacity comparison
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          ./scripts/persistence/test-legacy-history-compatibility.ps1 -OutputDirectory "$env:RUNNER_TEMP/history-evidence"

      - name: Upload legacy compatibility and capacity evidence
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: history-evidence
          path: '${{ runner.temp }}/history-evidence/*.json'
          if-no-files-found: error

      - name: Measure immutable A B C history performance
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          ./scripts/persistence/test-baseline-history-performance.ps1 -OutputDirectory "$env:RUNNER_TEMP/history-performance"

      - name: Upload repeated history performance samples
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: history-performance
          path: '${{ runner.temp }}/history-performance/*.json'
          if-no-files-found: error

      - name: Verify native persistence evidence
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          ./scripts/persistence/collect-persistence-evidence.ps1 `
            -ResultsDirectory "$env:RUNNER_TEMP/test-results" `
            -OutputPath "$env:RUNNER_TEMP/persistence-platform.json" `
            -CommitSha '${{ github.sha }}'

      - name: Upload persistence platform and fault evidence
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: persistence-platform
          path: '${{ runner.temp }}/persistence-platform.json'
          if-no-files-found: error

      - name: Upload controlled launch platform metadata
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: launch-platform
          path: '${{ runner.temp }}/launch-platform.json'
          if-no-files-found: error

      - name: Upload test results
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '${{ runner.temp }}/test-results/*.trx'
          if-no-files-found: error

      - name: Upload generated v2 capacity evidence
        if: always() && steps.solution.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: v2-evidence
          path: '${{ runner.temp }}/v2-evidence/*.json'
          if-no-files-found: error

      - name: Publish and verify E2-I1 native engineering package
        if: steps.solution.outputs.found == 'true'
        shell: pwsh
        run: |
          ./scripts/host/publish-native-engineering.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/e2-i1-engineering" `
            -CommitSha '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Upload E2-I1 native engineering package
        uses: actions/upload-artifact@v7
        with:
          name: e2-i1-windows-x64-engineering
          path: '${{ runner.temp }}/e2-i1-engineering/'
          if-no-files-found: error
